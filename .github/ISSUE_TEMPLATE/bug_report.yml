name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please sanitize secrets and production data before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 3.14.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
