name: community-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r 35_RUNTIME/requirements.txt
      - name: Public release checks
        run: ./65_PUBLIC_DEMO_GITHUB_COMMUNITY_EDITION/scripts/public-check.sh
      - name: Run project tests
        run: PYTHONPATH=35_RUNTIME python -m pytest -q --disable-warnings --maxfail=1 27_MCP_TOOL_GATEWAY/tests 28_CLAUDE_E2E/tests 30_AUTOMATION/tests 35_RUNTIME/tests 58_AUTONOMOUS_INCIDENT_DETECTION_CORRELATION/tests 59_EVENT_DRIVEN_AGENT_TRIGGERING_INCIDENT_COMMANDER/tests 61_REAL_TELEMETRY_EVENT_INGESTION/tests 62_PRODUCTION_OBSERVABILITY_CONNECTORS/tests 63_AUTOMATED_INCIDENT_INVESTIGATION/tests 64_INVESTIGATION_UI_OPERATIONAL_DASHBOARD/tests 65_PUBLIC_DEMO_GITHUB_COMMUNITY_EDITION/tests

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install curl and runtime dependencies
        run: python -m pip install -r 35_RUNTIME/requirements.txt
      - name: Run public demo
        run: ./65_PUBLIC_DEMO_GITHUB_COMMUNITY_EDITION/demo/run_demo.sh
