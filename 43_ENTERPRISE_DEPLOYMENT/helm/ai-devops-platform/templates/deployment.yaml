apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-devops.fullname" . }}
  labels:
    {{- include "ai-devops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-devops-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-devops-runtime
    spec:
      serviceAccountName: {{ include "ai-devops.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "ai-devops.fullname" . }}-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.claude.apiKeySecretName }}
                  key: {{ .Values.claude.apiKeySecretKey }}
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: {{ if .Values.vault.existingPvc }}{{ .Values.vault.existingPvc }}{{ else }}{{ include "ai-devops.fullname" . }}-vault{{ end }}
        - name: tmp
          emptyDir: {}
