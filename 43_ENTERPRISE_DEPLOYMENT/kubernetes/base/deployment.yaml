apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-runtime
  namespace: ai-devops
  labels:
    app.kubernetes.io/name: ai-devops-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-devops-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-devops-runtime
    spec:
      serviceAccountName: ai-devops-runtime
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/example/ai-devops-runtime:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-devops-runtime-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-devops-claude
                  key: ANTHROPIC_API_KEY
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: ai-devops-vault
        - name: tmp
          emptyDir: {}
