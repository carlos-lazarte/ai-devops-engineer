apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-devops-runtime
  namespace: ai-devops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-devops-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
