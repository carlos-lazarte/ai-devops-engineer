skill_id: "security-triage"
version: "1.0"
goal: "Provide a bounded Security capability for DevOps operations"
domains: ["Security"]
required_evidence: ["task_context", "relevant_operational_evidence"]
allowed_tools: ["search_notes", "read_note", "retrieve_runbook"]
forbidden_actions: ["shell", "ssh", "production_mutation", "secret_read"]
risk: "high"
autonomy_level: "L3"
output_schema: "../schemas/result.yaml"
verification:
  - "Every material claim must reference evidence"
  - "Proposed actions must be marked as proposals"
  - "Verify assumptions before escalation"
notes: "finding metadata, asset context, evidence; prioritize and propose bounded remediation"
