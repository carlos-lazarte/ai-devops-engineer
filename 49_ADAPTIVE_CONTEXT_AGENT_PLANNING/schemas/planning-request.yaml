type: object
required:
  - task_id
  - goal
  - tenant_id
  - environment
properties:
  task_id:
    type: string
  goal:
    type: string
  tenant_id:
    type: string
  environment:
    type: string
    enum: [lab, dev, test, staging, prod]
  constraints:
    type: object
  allowed_skills:
    type: array
    items:
      type: string
  allowed_tools:
    type: array
    items:
      type: string
