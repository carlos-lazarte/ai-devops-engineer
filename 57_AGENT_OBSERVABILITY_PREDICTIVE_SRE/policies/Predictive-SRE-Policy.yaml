policy_version: "1.0"
defaults:
  automatic_remediation: false
  production_execution_enabled: false
thresholds:
  anomaly_warning_ratio: 1.50
  anomaly_critical_ratio: 2.00
  minimum_prediction_confidence: 0.80
  high_risk_requires_human_review: true
rules:
  - id: prediction_is_not_fact
    effect: require
  - id: prediction_cannot_authorize
    effect: deny
  - id: critical_risk_requires_review
    effect: require
  - id: automatic_remediation_disabled
    effect: deny
