type: object
required: [metric, observed, baseline, severity, confidence]
properties:
  metric: {type: string}
  observed: {type: number}
  baseline: {type: number}
  deviation_ratio: {type: number}
  severity: {type: string, enum: [info, warning, critical]}
  confidence: {type: number}
  state: {type: string, enum: [OBSERVED, CORRELATED, ANOMALOUS, PREDICTED, CONFIRMED]}
