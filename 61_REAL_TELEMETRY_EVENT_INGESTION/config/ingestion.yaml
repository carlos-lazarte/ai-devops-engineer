prometheus:
  enabled: true
  url_env: PROMETHEUS_URL
  timeout_seconds: 5
  max_query_length: 4096
  max_response_bytes: 2000000

limits:
  max_http_body_bytes: 2000000
  max_otlp_events: 1000

security:
  read_only_prometheus: true
  tenant_isolation_required: true
  production_remediation_enabled: false
