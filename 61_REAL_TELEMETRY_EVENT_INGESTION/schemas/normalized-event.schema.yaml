title: AI DevOps Normalized Telemetry Event
required:
  - event_id
  - timestamp
  - tenant_id
  - environment
  - component
  - metric_family
  - condition
properties:
  event_id: {type: string}
  timestamp: {type: number}
  tenant_id: {type: string}
  environment: {type: string}
  component: {type: string}
  metric_family: {type: string}
  condition: {type: string}
  severity_hint: {enum: [info, warning, high, critical]}
  value: {}
  source: {type: string}
  topology_neighbors:
    type: array
    items: {type: string}
  labels:
    type: object
  provenance:
    type: object
